name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach jars to
        type: string
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: Discover version branches
    runs-on: ubuntu-latest
    outputs:
      branches: ${{ steps.list.outputs.branches }}
      tag: ${{ steps.list.outputs.tag }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Resolve tag and branch list
        id: list
        run: |
          set -euo pipefail

          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ ! -f .github/versions.json ]; then
            echo "::error::.github/versions.json not found. Create it with the branch names/patterns to build, e.g. [\"dev\", \"mc/*\"]"
            exit 1
          fi

          ENTRIES=$(jq -c 'if type=="array" then . else .branches end' .github/versions.json)

          mapfile -t REMOTE_BRANCHES < <(git ls-remote --heads origin | sed 's#.*refs/heads/##')

          RESOLVED=()
          while IFS= read -r entry; do
            case "$entry" in
              *[\*\?\[]*)
                matched=0
                for b in "${REMOTE_BRANCHES[@]}"; do
                  if [[ "$b" == $entry ]]; then
                    RESOLVED+=("$b")
                    matched=1
                  fi
                done
                [ "$matched" -eq 0 ] && echo "::warning::Pattern '$entry' in versions.json matched no branches"
                ;;
              *)
                if printf '%s\n' "${REMOTE_BRANCHES[@]}" | grep -qx -- "$entry"; then
                  RESOLVED+=("$entry")
                else
                  echo "::warning::Branch '$entry' in versions.json does not exist, skipping"
                fi
                ;;
            esac
          done < <(echo "$ENTRIES" | jq -r '.[]')

          if [ "${#RESOLVED[@]}" -eq 0 ]; then
            echo "::error::No branches resolved from versions.json entries: $ENTRIES"
            exit 1
          fi

          BRANCHES=$(printf '%s\n' "${RESOLVED[@]}" | awk '!seen[$0]++' | jq -R . | jq -sc .)

          echo "Branches to build: $BRANCHES"
          echo "branches=$BRANCHES" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.branch }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Compute safe branch name
        id: safe
        run: echo "name=$(echo '${{ matrix.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect and name release jars
        id: collect
        run: |
          set -euo pipefail

          BASE=$(grep -oP '^project_name\s*=\s*\K.*' gradle.properties | tr -d '[:space:]')
          MC=$(grep -oP 'minecraftVersion\s*=\s*"\K[^"]+' gradle/libs.versions.toml)
          PLATFORMS=$(grep -oP '^enabled_platforms\s*=\s*\K.*' gradle.properties | tr -d '[:space:]')

          echo "base=$BASE minecraft=$MC platforms=$PLATFORMS"

          mkdir -p release-assets
          IFS=',' read -ra PLATS <<< "$PLATFORMS"
          for p in "${PLATS[@]}"; do
            p=$(echo "$p" | tr -d '[:space:]')
            [ -z "$p" ] && continue
            found=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              stem=$(basename "$f" .jar)
              rest=${stem#${BASE}-}
              rest=${rest%-${p}}
              newname="${BASE}-${p}-${MC}-${rest}.jar"
              cp "$f" "release-assets/$newname"
              echo "  $f -> release-assets/$newname"
              found=1
            done < <(find . -path "*/visor-${p}/build/libs/*.jar" ! -name '*-dev.jar' ! -name '*-sources.jar')
            if [ "$found" -eq 0 ]; then
              echo "::warning::No release jar found for platform '$p' on branch ${{ matrix.branch }}"
            fi
          done

          echo "Assets:"
          ls -la release-assets/

      - name: Upload jars to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.discover.outputs.tag }}" release-assets/*.jar \
            --repo "${{ github.repository }}" --clobber

      - name: Upload build artifacts (traceability)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.safe.outputs.name }}
          path: release-assets/*.jar
          retention-days: 14
          if-no-files-found: error
