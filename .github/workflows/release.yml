name: Release build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach jars to
        type: string
        required: true

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover:
    name: Discover version branches
    uses: ./.github/workflows/discover.yml

  build:
    name: Build ${{ matrix.branch }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.discover.outputs.branches) }}
    steps:
      - name: Checkout ${{ matrix.branch }}
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Compute safe branch name
        id: safe
        run: echo "name=$(echo '${{ matrix.branch }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Collect and name release jars
        run: |
          set -euo pipefail

          BASE=$(grep -oP '^project_name\s*=\s*\K.*' gradle.properties | tr -d '[:space:]')
          MC=$(grep -oP 'minecraftVersion\s*=\s*"\K[^"]+' gradle/libs.versions.toml)
          PLATFORMS=$(grep -oP '^enabled_platforms\s*=\s*\K.*' gradle.properties | tr -d '[:space:]')

          echo "base=$BASE minecraft=$MC platforms=$PLATFORMS"

          mkdir -p release-assets
          IFS=',' read -ra PLATS <<< "$PLATFORMS"
          for p in "${PLATS[@]}"; do
            p=$(echo "$p" | tr -d '[:space:]')
            [ -z "$p" ] && continue
            found=0
            while IFS= read -r f; do
              [ -z "$f" ] && continue
              stem=$(basename "$f" .jar)
              rest=${stem#${BASE}-}
              rest=${rest%-${p}}
              newname="${BASE}-${p}-${MC}-${rest}.jar"
              cp "$f" "release-assets/$newname"
              echo "  $f -> release-assets/$newname"
              found=1
            done < <(find . -path "*/visor-${p}/build/libs/*.jar" ! -name '*-dev.jar' ! -name '*-sources.jar')
            if [ "$found" -eq 0 ]; then
              echo "::warning::No release jar found for platform '$p' on branch ${{ matrix.branch }}"
            fi
          done

          echo "Assets:"
          ls -la release-assets/

      - name: Upload jars to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          gh release upload "$TAG" release-assets/*.jar \
            --repo "${{ github.repository }}" --clobber

      - name: Upload build artifacts (traceability)
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.safe.outputs.name }}
          path: release-assets/*.jar
          retention-days: 14
          if-no-files-found: error
