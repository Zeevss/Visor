name: Publish to Modrinth / CurseForge

# Required repository configuration:
#   Variables:
#   - MODRINTH_ID
#   - CURSEFORGE_ID
#   Secrets:
#   - MODRINTH_TOKEN
#   - CURSEFORGE_TOKEN

run-name: Publish ${{ inputs.tag }} to ${{ inputs.platforms }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        type: string
        required: true
      platforms:
        description: Where to publish
        type: choice
        options:
          - both
          - modrinth
          - curseforge
        default: both
      version_type:
        description: Release channel
        type: choice
        options:
          - release
          - beta
          - alpha
        default: release
      dry_run:
        description: Dry run (resolve assets, but do not upload)
        type: boolean
        default: false

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    name: Read release assets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.assets.outputs.matrix }}
    steps:
      - name: Build asset matrix
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MATRIX=$(gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --json assets \
            --jq '[ .assets[].name
                    | select(endswith(".jar"))
                    | select(test("-sources\\.jar$") | not)
                    | { file: ., loader: (split("-")[1]), mc: (split("-")[2]) } ]')

          echo "Resolved assets: $MATRIX"
          if [ "$MATRIX" = "[]" ] || [ -z "$MATRIX" ]; then
            echo "::error::No publishable jars found on release '${{ inputs.tag }}'. Run the Release build workflow first."
            exit 1
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

      - name: Save changelog from release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --json body --jq '.body // ""' > changelog.md

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: changelog.md
          retention-days: 1

  publish:
    name: Publish ${{ matrix.entry.file }}
    needs: discover
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        entry: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog

      - name: Download jar from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ inputs.tag }}" --repo "${{ github.repository }}" \
            --pattern "${{ matrix.entry.file }}" --dir dist

      - name: Compute publish metadata
        id: meta
        run: |
          set -euo pipefail
          FILE="${{ matrix.entry.file }}"
          LOADER="${{ matrix.entry.loader }}"
          MC="${{ matrix.entry.mc }}"
          MODVER=$(echo "${FILE%.jar}" | cut -d- -f4-)

          # Only expose an id for platforms the user selected; mc-publish skips a
          # platform when its id is empty.
          MR_ID="${{ vars.MODRINTH_ID }}"
          CF_ID="${{ vars.CURSEFORGE_ID }}"
          case "${{ inputs.platforms }}" in
            modrinth)   CF_ID="" ;;
            curseforge) MR_ID="" ;;
          esac

          {
            echo "modver=$MODVER"
            echo "modrinth_id=$MR_ID"
            echo "curseforge_id=$CF_ID"
            echo "display_name=Visor $MODVER - MC $MC ($LOADER)"
            echo "version=$MODVER+mc$MC-$LOADER"
          } >> "$GITHUB_OUTPUT"

      - name: Dry run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "DRY RUN - would publish:"
          echo "  file:          dist/${{ matrix.entry.file }}"
          echo "  loaders:       ${{ matrix.entry.loader }}"
          echo "  game-versions: ${{ matrix.entry.mc }}"
          echo "  version:       ${{ steps.meta.outputs.version }}"
          echo "  version-type:  ${{ inputs.version_type }}"
          echo "  modrinth-id:   ${{ steps.meta.outputs.modrinth_id }}"
          echo "  curseforge-id: ${{ steps.meta.outputs.curseforge_id }}"

      - name: Publish
        if: ${{ !inputs.dry_run }}
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ steps.meta.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: false

          curseforge-id: ${{ steps.meta.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: dist/${{ matrix.entry.file }}
          name: ${{ steps.meta.outputs.display_name }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ inputs.version_type }}
          loaders: ${{ matrix.entry.loader }}
          game-versions: ${{ matrix.entry.mc }}
          changelog-file: changelog.md
          fail-mode: warn
